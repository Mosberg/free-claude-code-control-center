<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="grad-model" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow-model" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow-model)" stroke="url(#grad-model)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Octahedron / Neural Hypergraph -->
    <polygon points="64,18 100,38 100,82 64,106 28,82 28,38" />

    <!-- Inner Core Isometric Diamond Nodes -->
    <line x1="64" y1="18" x2="64" y2="58" />
    <line x1="64" y1="106" x2="64" y2="66" />
    <line x1="28" y1="38" x2="52" y2="52" />
    <line x1="100" y1="38" x2="76" y2="52" />
    <line x1="28" y1="82" x2="52" y2="72" />
    <line x1="100" y1="82" x2="76" y2="72" />

    <!-- Cross Facet Lattice Web -->
    <line x1="52" y1="52" x2="76" y2="52" />
    <line x1="76" y1="52" x2="64" y2="66" />
    <line x1="64" y1="66" x2="52" y2="52" />
    
    <line x1="52" y1="72" x2="76" y2="72" />
    <line x1="76" y1="72" x2="64" y2="58" />
    <line x1="64" y1="58" x2="52" y2="72" />

    <!-- Core Cross Points -->
    <line x1="28" y1="38" x2="100" y2="82" opacity="0.6" stroke-dasharray="3 3"/>
    <line x1="100" y1="38" x2="28" y2="82" opacity="0.6" stroke-dasharray="3 3"/>

    <!-- Vertex Points / Synaptic Spheres -->
    <circle cx="64" cy="18" r="3.5" fill="#38bdf8" />
    <circle cx="100" cy="38" r="3.5" fill="#818cf8" />
    <circle cx="100" cy="82" r="3.5" fill="#c084fc" />
    <circle cx="64" cy="106" r="3.5" fill="#e879f9" />
    <circle cx="28" cy="82" r="3.5" fill="#c084fc" />
    <circle cx="28" cy="38" r="3.5" fill="#818cf8" />

    <circle cx="64" cy="62" r="4.5" fill="#67e8f9" />
  </g>
</svg>